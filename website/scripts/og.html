<!doctype html>
<!--
  Banig's OgImage, rendered to public/og.png by scripts/og.ts: an ink tile with
  the name and the hero's claim, an accent tile with a second measured number, so it adds to the claim instead of repeating it, and
  the address. It uses the site's tokens and fonts, in the light theme.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/banig.css" />
    <style>
      /* banig.css loads the fonts from the site's root, which a file has not. */
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-weight: 200 800;
        src: url('../public/fonts/bricolage-grotesque.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Martian Mono';
        font-weight: 100 800;
        src: url('../public/fonts/martian-mono.woff2') format('woff2');
      }
      body {
        margin: 0;
      }
      .og-name {
        display: inline-flex;
        align-items: center;
        gap: 14px;
      }
      .og-name svg {
        width: 44px;
        height: 44px;
      }
      .og-number {
        display: grid;
        gap: 12px;
      }
      .og-number strong {
        font: 800 120px/0.9 var(--font-sans);
        letter-spacing: -0.05em;
      }
      .og-number span {
        font-size: 26px;
        font-weight: 600;
        line-height: 1.25;
      }
      .og-address {
        padding: 24px 32px;
      }
      .og-address span {
        color: var(--muted);
        font: 400 22px var(--font-mono);
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="og-main">
        <span class="og-name">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M6 7h20l-5 5H6z" fill="#446b9e" />
            <path d="M6 14h20l-5 5H6z" fill="#4f88c6" />
            <path d="M6 21h20l-5 5H6z" fill="#76b3e1" />
          </svg>
          solid-optimizer
        </span>
        <h1 class="og-title">Same Solid app. <em>2× faster</em> server rendering.</h1>
      </div>
      <div class="og-side">
        <div class="tile og-number" data-tone="accent">
          <strong>−42%</strong>
          <span>memory per app on the Tracker benchmark</span>
        </div>
        <div class="tile og-address"><span>solid-optimizer.vercel.app</span></div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<!--
  The link preview image, rendered to public/og.png by scripts/og.ts: one ink
  tile with the name, the hero's claim, the install command and the address,
  in the site's tokens and fonts and the light theme. Banig's OgImage puts a
  measured number beside the claim; here the claim is already the measurement,
  and a number from one benchmark app means nothing to someone who never saw it.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/banig.css" />
    <style>
      /* banig.css loads the fonts from the site's root, which a file has not. */
      @font-face {
        font-family: 'Bricolage Grotesque';
        font-weight: 200 800;
        src: url('../public/fonts/bricolage-grotesque.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Martian Mono';
        font-weight: 100 800;
        src: url('../public/fonts/martian-mono.woff2') format('woff2');
      }
      body {
        margin: 0;
      }
      .og-name {
        display: inline-flex;
        align-items: center;
        gap: 14px;
      }
      .og-name svg {
        width: 44px;
        height: 44px;
      }
      .og {
        grid-template-columns: minmax(0, 1fr);
      }
      .og-main {
        gap: 32px;
      }
      .og-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .og-install {
        padding: 14px 20px;
        border-radius: var(--radius-full);
        background: var(--accent-fill);
        color: var(--on-accent);
        font: 500 26px var(--font-mono);
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="og-main">
        <span class="og-name">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M6 7h20l-5 5H6z" fill="#446b9e" />
            <path d="M6 14h20l-5 5H6z" fill="#4f88c6" />
            <path d="M6 21h20l-5 5H6z" fill="#76b3e1" />
          </svg>
          solid-optimizer
        </span>
        <h1 class="og-title">Same Solid app. <em>2× faster</em> server rendering.</h1>
        <div class="og-foot">
          <code class="og-install">npm i -D solid-optimizer</code>
          <span class="og-url">solid-optimizer.vercel.app</span>
        </div>
      </div>
    </div>
  </body>
</html>

name: Bench

# Builds the examples of a pull request and of its base, with and without the
# optimizer, and comments with the change in bundle size and build time.
on:
  pull_request:

# A newer push to the same pull request makes the older run useless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # post the results as a comment

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      # The pnpm version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: head/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            head/pnpm-lock.yaml
            base/pnpm-lock.yaml

      - name: Build the pull request
        working-directory: head
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter solid-optimizer build

      # The base may not build, or may have no examples yet. The comment then
      # shows the pull request's results alone.
      - name: Build the base
        id: base
        continue-on-error: true
        working-directory: base
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter solid-optimizer build

      # Both use the pull request's script, so the base is measured the same way.
      - name: Benchmark
        run: |
          node head/scripts/bench.ts --root head --json head.json --markdown - > /dev/null
          if [ "${{ steps.base.outcome }}" = success ] && node head/scripts/bench.ts --root base --json base.json --markdown - > /dev/null; then
            node head/scripts/bench.ts --from head.json --compare base.json --markdown comment.md
          else
            node head/scripts/bench.ts --from head.json --markdown comment.md
          fi

      # Updates the comment from an earlier run instead of adding another. A
      # pull request from a fork has a read-only token, so this step may fail.
      - name: Comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          MARKER='<!-- solid-optimizer-bench -->'
          { echo "$MARKER"; cat comment.md; } > body.md
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id // empty" | head -n 1)
          if [ -n "$ID" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@body.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md > /dev/null
          fi
          cat body.md >> "$GITHUB_STEP_SUMMARY"
